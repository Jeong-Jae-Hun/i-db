[package]
name = "idb-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true

# macOS 전용 GUI(i-db.app). 리눅스에서는 화면 없이 뷰 모델만 빌드·시험한다
[[bin]]
name = "i-db"
path = "src/main.rs"

[dependencies]
idb-core.workspace = true
idb-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9" }
# font-kit 이 없으면 macOS 텍스트 시스템이 Noop 이라 글자가 하나도 그려지지 않는다(vm::picker 시험이 지킨다)
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit"] }
gpui-component = { version = "=0.8.0", features = ["tree-sitter-sql"] }
gpui-kit-assets = "=0.8.0"
# 자동 완성 꼴(gpui-component 0.8 이 쓰는 판)
lsp-types = { version = "0.97", features = ["proposed"] }
anyhow = "1"
# AppKit Touch Bar 종료 버그 우회(ui::appkit_guard). GPUI 가 이미 쓰는 판이다
objc2 = { version = "0.6.5", features = ["exception"] }
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
raw-window-handle = "0.6.2"

[dev-dependencies]
tempfile.workspace = true

# 화면 시험: GPU 없는 시험 창에 그려 그리기·흐름이 넘어지지 않는지 본다
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
