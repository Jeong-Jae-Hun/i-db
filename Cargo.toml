[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
idb-core = { path = "crates/idb-core" }
idb-sources = { path = "crates/idb-sources" }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
unicode-segmentation = "1"
url = "2"
percent-encoding = "2"
aes = "0.8"
cbc = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
sha2 = "0.10"
tempfile = "3"
# DB 클라이언트(idb-sources). OpenSSL 없이 rustls(ring)만 쓴다
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
postgres-protocol = "0.6"
bytes = "1"
fallible-iterator = "0.2"
# HTTP 저장소(OpenSearch·Loki·Prometheus·Grafana). TLS 는 tls.rs 의 rustls(ring) 설정을 그대로 넘긴다
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# OpenSearch sigv4. 자격 증명은 Go config.LoadDefaultConfig 처럼 기본 체인(환경·프로필·SSO·프로세스)에서 읽는다
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "sso", "credentials-process", "behavior-version-latest"] }
aws-credential-types = "1"
aws-sigv4 = "1"
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }

[profile.release]
strip = true
lto = "thin"
