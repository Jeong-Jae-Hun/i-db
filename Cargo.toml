[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
idb-core = { path = "crates/idb-core" }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
unicode-segmentation = "1"
url = "2"
percent-encoding = "2"
aes = "0.8"
cbc = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
sha2 = "0.10"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
